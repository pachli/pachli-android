org.gradle.caching=true
# If jvmargs is changed then the default values must also be included, see https://github.com/gradle/gradle/issues/19750
org.gradle.jvmargs=-XX:+UseParallelGC -Xms6g -Xmx12g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=4g -XX:+HeapDumpOnOutOfMemoryError
# use parallel execution
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

android.useAndroidX=true
# AGP 9 disables unit tests for the "release" type by default
# (https://developer.android.com/build/releases/agp-9-0-0-release-notes).
# Re-enable them.
android.onlyEnableUnitTestForTheTestedBuildType=false
# Disable android.r8.strictFullModeForKeepRules. If enabled this
# marks the default constructor as removable. This causes problems
# for (at least) MLKit, crashing at startup with:
#
# java.lang.NullPointerException: Attempt to read from field
# 'com.google.mlkit.nl.languageid.internal.zzg com.google.mlkit.nl.languageid.internal.LanguageIdentifierImpl$Factory.b' on a null object reference in method 'com.google.mlkit.nl.languageid.internal.LanguageIdentifierImpl com.google.mlkit.nl.languageid.LanguageIdentification.a()'
# at com.google.mlkit.nl.languageid.LanguageIdentification.a(SourceFile:13)
#
# see https://github.com/googlesamples/mlkit/issues/1001 and
# https://github.com/googlesamples/mlkit/issues/1007
#
# (possible alternate -keep rule is:
# -keep class com.google.mlkit.nl.languageid.internal.** { <init>(); }
# )
# and
#
# java.lang.RuntimeException: Unable to get provider com.google.mlkit.common.internal.MlKitInitProvider: com.google.firebase.components.MissingDependencyException: Unsatisfied dependency for component Component<[class com.google.mlkit.nl.languageid.internal.LanguageIdentifierImpl$Factory]>{0, type=0, deps=[Dependency{anInterface=class com.google.mlkit.common.sdkinternal.ExecutorSelector, type=required, injection=direct}, Dependency{anInterface=class com.google.mlkit.nl.languageid.internal.zzg, type=required, injection=direct}]}: class com.google.mlkit.common.sdkinternal.ExecutorSelector
# see https://issuetracker.google.com/issues/574078150 (which has an
# alternate -keep rule)
#
# This can be removed when MlKit ships AGP 9 compatible rules.
android.r8.strictFullModeForKeepRules=false

# Display more detail about verification failures, useful when
# reading CI logs for failed builds.
org.gradle.dependency.verification.console=verbose
# Experimental support for screenshot testing
android.experimental.enableScreenshotTest=true
# Enable isolated projects for parallel configuration.
org.gradle.isolated-projects=true
ksp.project.isolation.enabled=true