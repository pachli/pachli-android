org.gradle.caching=true
# If jvmargs is changed then the default values must also be included, see https://github.com/gradle/gradle/issues/19750
org.gradle.jvmargs=-XX:+UseParallelGC -Xms6g -Xmx12g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=4g -XX:+HeapDumpOnOutOfMemoryError
# use parallel execution
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Disable buildFeatures flags by default
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.useAndroidX=true

# Display more detail about verification failures, useful when
# reading CI logs for failed builds.
org.gradle.dependency.verification.console=verbose
# Experimental support for screenshot testing
android.experimental.enableScreenshotTest=true
#android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
#android.enableAppCompileTimeRClass=false
#android.usesSdkInManifest.disallowed=false
#android.uniquePackageNames=false
#android.dependency.useConstraints=true
#android.r8.strictFullModeForKeepRules=false
#android.r8.optimizedResourceShrinking=false
#android.builtInKotlin=false
#android.newDsl=false
# Enable isolated projects for parallel configuration.
org.gradle.isolated-projects=true
ksp.project.isolation.enabled=true
